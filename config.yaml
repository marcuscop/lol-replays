# Remember to update league through riot client before using.

settings:
  platform: "kr"
  cluster: "asia"
  api_key_env: "RIOT_API_KEY"
  dry_run: false
  record: true
  wait_for_match: true
  num_games: 10
  output: null
  league_client_startup_attempts: 5
  league_process_names: ["LeagueofLegends", "League of Legends"]
  request_timeout_seconds: 15
  local_api_timeout_seconds: 50
  local_api_poll_seconds: 2
  wait_poll_seconds: 10
  spectator_error_backoff_seconds: 30
  recording_check_interval_seconds: 5
  recording_timeout_seconds: 7200
  playback_finish_threshold_seconds: 1
  playback_finish_confirmation_seconds: 5
  window_focus_delay_seconds: 1.0
  rune_tab_key: "c"
  rune_tab_key_hold_seconds: 0.1
  fog_hotkey_hold_seconds: 0.10
  camera_hotkey_hold_seconds: 0.08
  camera_hotkey_between_presses_seconds: 0.12
  display_mode:
    enabled: true
    betterdisplay_path: "/Applications/BetterDisplay.app/Contents/MacOS/BetterDisplay"
    selector: "-displaywithmainstatus"
    resolution: "1920x1200"
    hi_dpi: "on"
    refresh_rate: null
    display_mode_number: 72
    settle_seconds: 2.0
  league_game_config:
    enabled: true
    path: "/Applications/League of Legends.app/Contents/LoL/Config/game.cfg"
    window_mode: 1
    width: 1920
    height: 1080
    backup: true
  recording:
    width: 1920
    height: 1080
    frames_per_second: 60
    lossless: false
    enforce_frame_rate: false
    replay_speed: 1.0
    start_offset_seconds: 2.0
    end_time: -1.0

